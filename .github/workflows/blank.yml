name: Build mod
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip/rar parts and locate project
        id: proj
        run: |
          # ZIP
          find . -name "*.zip" -not -path "./.git/*" | while read -r z; do unzip -oq "$z"; done
          # RAR (termasuk part1.rar + part2.rar: cukup ekstrak part pertama)
          for f in $(find . -name "*.rar" -not -path "./.git/*"); do
            case "$f" in
              *.part[0-9]*.rar)
                case "$f" in *.part1.rar|*.part01.rar|*.part001.rar) ;; *) continue ;; esac ;;
            esac
            echo "Ekstrak $f"
            if ! 7z x -y "$f" > /dev/null; then
              sudo apt-get update -qq && sudo apt-get install -y -qq unrar
              unrar x -o+ -idq "$f"
            fi
          done
          BG=$(find . -name build.gradle -not -path "./.git/*" | head -n1)
          if [ -z "$BG" ]; then
            echo "build.gradle tidak ditemukan. Isi repo:"
            find . -maxdepth 3 -not -path "./.git/*" | head -60
            exit 1
          fi
          echo "dir=$(dirname "$BG")" >> "$GITHUB_OUTPUT"
          echo "Project di: $(dirname "$BG")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Build
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sirenhead-mod-jar
          path: ${{ steps.proj.outputs.dir }}/build/libs/*.jar
